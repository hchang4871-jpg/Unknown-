  <body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
    <!-- Global SVG High-Definition Unsharp Mask Filter for crisp leather grain and stitching -->
    <svg width="0" height="0" class="fixed pointer-events-none opacity-0" aria-hidden="true">
      <defs>
        <filter id="hd-sharpen" color-interpolation-filters="sRGB">
          <feConvolveMatrix
            order="3 3"
            preserveAlpha="true"
            kernelMatrix="0 -0.35 0 -0.35 2.4 -0.35 0 -0.35 0"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
